spring:
  task:
    scheduling:
      pool:
        size: 3                      # 워커 폴링, 멈춘 작업 복구, SSE 푸시가 서로 막히지 않게
  application:
    name: repo-inspect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      timeout: 500ms                 # Redis 가 느리면 기다리지 않고 제한 없이 통과시킨다
      connect-timeout: 500ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/repoinspect}
    username: ${DB_USERNAME:repoinspect}
    password: ${DB_PASSWORD:repoinspect}

server:
  # 앞단 프록시(사설 대역)가 준 X-Forwarded-For 만 믿는다. 공인 IP 에서 온 헤더는 무시된다
  forward-headers-strategy: native

repo-inspect:
  web-origins: ${WEB_ORIGINS:http://localhost:3000}  # 브라우저에서 API 를 부르는 웹 화면 주소(쉼표로 여럿)
  rate-limit:
    analyses-per-minute: 10          # 같은 IP 의 분석 요청 1분 상한
  dispute-url: ${DISPUTE_URL:}      # 저장소 주인용 이의 제기 창구(비우면 응답에서 null)
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    max-tarball-bytes: 52428800      # 받는 압축 파일 상한 50MB
    max-concurrent: 8                # 동시에 나가는 GitHub 호출 상한(보조 한도와 스레드 묶임 방지)
    acquire-timeout-ms: 2000         # 자리가 날 때까지 기다리는 시간. 넘으면 5초 뒤 다시 시도로 안내
  archive:
    max-total-bytes: 209715200       # 풀린 전체 크기 상한 200MB(압축 폭탄 방어)
    max-files: 5000
    max-file-bytes: 1048576          # 파일 하나 1MB 넘으면 읽지 않음
  worker:
    enabled: true
    poll-ms: 1000
    read-idle-seconds: 30            # 압축 파일 본문 바이트가 이 시간 동안 안 오면 끊는다
    read-deadline-seconds: 300       # 본문 전체를 읽는 시간 상한(끝없이 찔끔 오는 응답 방어)
  events:
    poll-ms: 1000                    # SSE 구독 중인 작업 상태를 읽는 주기
    timeout-seconds: 600             # 스트림 하나의 최대 시간. 넘으면 화면이 다시 연결하거나 폴링한다
    max-subscribers: 500             # 동시에 열린 SSE 상한. 넘으면 503

management:
  endpoints:
    web:
      exposure:
        include: health              # 컨테이너 상태 확인용만. 외부에는 Caddy 에서 막는다
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false                 # Redis 장애는 요청 제한만 풀리므로 서버를 DOWN 으로 보지 않는다
