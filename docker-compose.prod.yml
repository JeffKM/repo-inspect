# 운영 서버 한 대용. 외부에는 Caddy 의 80/443 만 열고, app·DB·Redis 는 내부 네트워크에만 둔다.
# 비밀값은 같은 폴더의 .env(커밋하지 않음)에서 읽는다. 절차는 docs/02-배포.md
services:
  app:
    build: .
    image: repo-inspect:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/repoinspect
      DB_USERNAME: repoinspect
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 가 필요합니다}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN 이 필요합니다}
      DISPUTE_URL: ${DISPUTE_URL:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 1536m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repoinspect
      POSTGRES_USER: repoinspect
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoinspect -d repoinspect"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 요청 제한 카운터만 둔다. 디스크에 남기지 않는다
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 가 필요합니다}", "--save", "", "--appendonly", "no"]
    mem_limit: 64m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 가 필요합니다}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
